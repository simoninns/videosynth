name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - flake.nix
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7
        with:
          # The GitHub Actions cache is enough here and needs no account.
          # Leaving FlakeHub enabled makes every job emit an authentication
          # error annotation before falling back to it.
          use-flakehub: false

      - name: Build site with Nix
        run: nix build "path:$PWD#docs" --print-build-logs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./result

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
