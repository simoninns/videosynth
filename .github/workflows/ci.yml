name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master


jobs:
  build-tests:
    name: Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert progressive RAW fixtures are retired
        run: |
          if find resources/assets -type f -path '*/stills/raw/*.raw' -print -quit | grep -q .; then
            echo "Progressive RAW fixture assets are retired; remove resources/assets/**/stills/raw/*.raw files."
            exit 1
          fi
          if find tests/projects -maxdepth 1 -type f -name '*_progressive_raw.yaml' -print -quit | grep -q .; then
            echo "Progressive RAW fixture project YAMLs are retired; remove *_progressive_raw.yaml files."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

      - name: Run unit tests
        run: nix develop "path:$PWD" --command ctest --test-dir build --output-on-failure -L unit

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

      - name: Run functional tests
        run: nix develop "path:$PWD" --command ctest --test-dir build --output-on-failure -L functional
