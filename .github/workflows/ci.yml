name: CI

# Build, test and package. The Flatpak bundle is built on every push and pull
# request so packaging breakage is caught early, but only after the code has
# compiled and the unit tests have passed — packaging a broken tree wastes a
# long build and reports a second, misleading failure. The bundle is attached
# to a GitHub release only when the build was triggered by a version tag.
on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.simoninns.VideoSynth
  MANIFEST: packaging/flatpak/io.github.simoninns.VideoSynth.yml

jobs:
  clang-format:
    name: Clang-Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7
        with:
          # The GitHub Actions cache is enough here and needs no account.
          # Leaving FlakeHub enabled makes every job emit an authentication
          # error annotation before falling back to it.
          use-flakehub: false

      - name: Check formatting
        run: |
          nix develop "path:$PWD" --command bash -c '
          FAIL_COUNT=0
          for f in $(find . -path ./build -prune -o -path ./build-gprof -prune -o -path ./.git -prune -o -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print); do
            OUTPUT=$(clang-format -style=file --dry-run --Werror "$f" 2>&1)
            CLEAN_OUTPUT=$(echo "$OUTPUT" | grep -v "^warning: Git tree")
            if [ -n "$CLEAN_OUTPUT" ]; then
              echo "::error file=$f::Code formatting violation"
              echo "$CLEAN_OUTPUT"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          if [ $FAIL_COUNT -gt 0 ]; then
            echo "::error::$FAIL_COUNT file(s) have formatting issues"
            exit 1
          fi
          '

  build-tests:
    needs: clang-format
    name: Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7
        with:
          # The GitHub Actions cache is enough here and needs no account.
          # Leaving FlakeHub enabled makes every job emit an authentication
          # error annotation before falling back to it.
          use-flakehub: false

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7
        with:
          # The GitHub Actions cache is enough here and needs no account.
          # Leaving FlakeHub enabled makes every job emit an authentication
          # error annotation before falling back to it.
          use-flakehub: false

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

      - name: Run unit tests
        run: nix develop "path:$PWD" --command ctest --test-dir build --output-on-failure -L unit

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7
        with:
          # The GitHub Actions cache is enough here and needs no account.
          # Leaving FlakeHub enabled makes every job emit an authentication
          # error annotation before falling back to it.
          use-flakehub: false

      - name: Configure
        run: nix develop "path:$PWD" --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: nix develop "path:$PWD" --command cmake --build build --target videosynth_tests

      - name: Run functional tests
        run: nix develop "path:$PWD" --command ctest --test-dir build --output-on-failure -L functional

  flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests, functional-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The KDE SDK, the ffmpeg build and the 288 MB bundled asset library
      # together need more room than the default runner image leaves free.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          # appstream supplies appstreamcli, which flatpak-builder runs on the
          # host to compose the AppStream catalogue from the installed
          # metainfo; without it the build fails after every module succeeds.
          sudo apt-get install -y flatpak flatpak-builder appstream \
                                  desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      # Both packaging inputs are validated before the multi-gigabyte build
      # starts. The metainfo is a CMake template, so the placeholders are
      # substituted with sample values for the syntax check only.
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate "packaging/linux/${APP_ID}.desktop"
          sed -e 's/@VIDEOSYNTH_RELEASE_VERSION@/0.0.0/' \
              -e 's/@VIDEOSYNTH_RELEASE_DATE@/2000-01-01/' \
              "packaging/linux/${APP_ID}.metainfo.xml.in" \
              > "/tmp/${APP_ID}.metainfo.xml"
          appstreamcli validate --no-net --explain "/tmp/${APP_ID}.metainfo.xml"

      # A tag build reports the tag; every other build reports the short commit
      # so the version string always identifies what was built. The AppStream
      # release date comes from the commit rather than the wall clock, keeping
      # rebuilds of the same commit identical.
      - name: Resolve release metadata
        id: metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="0.0.0+$(git rev-parse --short HEAD)"
          fi
          date="$(git log -1 --format=%cs)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version} dated ${date}"

      - name: Generate manifest
        run: |
          python3 scripts/prepare-flatpak-manifest.py \
            --manifest "${MANIFEST}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --date "${{ steps.metadata.outputs.date }}" \
            --output "flatpak-build/${APP_ID}.yml"

      # Keyed on the manifest alone: the dependency modules only change when it
      # does, and a fixed key stops every push from writing a fresh multi-
      # gigabyte cache entry. The videosynth module itself is invalidated by
      # its own source checksum and rebuilt regardless.
      - name: Restore Flatpak build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/io.github.simoninns.VideoSynth.yml') }}

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build/build "flatpak-build/${APP_ID}.yml"

      - name: Create bundle
        id: bundle
        run: |
          bundle="videosynth-${{ steps.metadata.outputs.version }}-${{ matrix.arch }}.flatpak"
          flatpak build-bundle flatpak-repo "${bundle}" "${APP_ID}"
          sha256sum "${bundle}" > "${bundle}.sha256"
          ls -lh "${bundle}"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"

      # Smoke test: the exported metadata is what makes the application appear
      # in the desktop menus, so a bundle missing it is a failed build.
      - name: Verify exported desktop integration
        run: |
          for exported in \
            "files/share/applications/${APP_ID}.desktop" \
            "files/share/metainfo/${APP_ID}.metainfo.xml" \
            "files/share/icons/hicolor/256x256/apps/${APP_ID}.png" \
            "files/bin/videosynth-gui" \
            "files/bin/videosynth" \
            "files/bin/ffmpeg" \
            "files/share/videosynth/assets"
          do
            if [ ! -e "flatpak-build/build/${exported}" ]; then
              echo "::error::missing from the build: ${exported}"
              exit 1
            fi
          done
          grep -q '^command=videosynth-gui$' flatpak-build/build/metadata

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: videosynth-flatpak-${{ matrix.arch }}
          path: |
            ${{ steps.bundle.outputs.bundle }}
            ${{ steps.bundle.outputs.bundle }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    runs-on: ubuntu-24.04
    needs: flatpak
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: videosynth-flatpak-*
          merge-multiple: true
          path: bundles

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/*
          fail_on_unmatched_files: true
