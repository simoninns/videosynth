          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }

  # ---------------------------------------------------------------------------
  # Mid-file motion content: 47-frame clip replayed 600 times = 28,200 frames.
  # ---------------------------------------------------------------------------
  - name: PalMkvSmpteBars
    type: progressive
    source: "{bundled}/mkv/720x576/SMPTE_BARS.mkv"
    duration_frames: all
    duration_repeat: 600
    audio:
      channel_pairs:
        - pair: 0
          description: Analogue stereo
          left:  { waveform: sine, frequency: 1400.0, amplitude: 0.5 }
          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }

  # ---------------------------------------------------------------------------
  # Second still block: 9 sections x 10,000 frames = 90,000 frames.
  # ---------------------------------------------------------------------------
