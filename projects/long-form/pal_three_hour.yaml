  # ---------------------------------------------------------------------------
  # Tail section: carries the balance so the project totals exactly 270,000
  # frames (50,800 + 90,000 + 28,200 + 90,000 + 11,000).
  # ---------------------------------------------------------------------------
  - name: PalYCbCrRamps
    type: progressive
    source: "{bundled}/exr/720x576/Y_CB_CR_RAMPS.exr"
