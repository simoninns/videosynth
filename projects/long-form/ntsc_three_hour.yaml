  # ---------------------------------------------------------------------------
  # Tail section: carries the balance so the project totals 323,676 frames
  # (51,200 + 117,000 + 37,200 + 104,000 + 14,276).
  # ---------------------------------------------------------------------------
  - name: NtscYCbCrRamps
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 14276
