project:
  name: NTSCVitsFixture
  version: "1.0"
  description: NTSC VITS fixture

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{output}/videosynth_ntsc_vits.cvbs"

line_injections:
  vits:
    - vits_type: ntc7-composite
      target_lines: [17]
    - vits_type: fcc-multiburst
      target_lines: [18]
    - vits_type: virs
      target_lines: [21]
    - vits_type: ntc7-combination
      target_lines: [280]
    - vits_type: fcc-composite
      target_lines: [281]

sections:
  - name: NtscVits
    type: progressive
    source: "{bundled}/exr/720x486/100_BARS.exr"
    duration_frames: 1