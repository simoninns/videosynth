site_name: videosynth Documentation
site_url: https://decode-orc.github.io/videosynth
repo_url: https://github.com/decode-orc/videosynth
repo_name: decode-orc/videosynth

theme:
  name: material
  logo: assets/videosynth-logo.svg
  favicon: assets/videosynth-icon-32.png
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - awesome-nav

# docs/ holds only the published site. Design documents, in-repository feature
# documentation and the specification submodules live under docs-tech/.
#
# Navigation is assembled from the .nav.yml files inside docs/ by awesome-nav.

# Anchor validation is off by default; enable it so `mkdocs build --strict`
# catches a heading link that no longer resolves.
validation:
  links:
    anchors: warn
