# NTSC Scratch Dropout Ramp
#
# 21 sections × 8 frames; scratch dropout scale steps from 0 (none) through
# 20 (maximum). Random dropouts absent — isolates the triangular-envelope
# scratch model.
#
# Scale mapping (see dropout-injection-design.md §Scale Mapping):
#   Scale  1 → 1 scratch event,  max lifespan 2 frames,  max peak width 5 samples
#   Scale 10 → 8 scratch events, max lifespan ~113 frames, max peak width 282 samples
#   Scale 20 → 15 scratch events, max lifespan 500 frames, max peak width 2000 samples
#
# Note: at low section durations (8 frames) and high scales, scratch events will
# not complete their full triangle envelope — the validator emits a warning for
# scales where max_dur_frames > 8.

project:
  name: NtscDropoutScratchRamp
  version: "1.0"
  description: NTSC scratch dropout ramp — scale 0 through 20 (scratch only)

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output-general/videosynth_ntsc_dropout_scratch_ramp.composite
  metadata_path: tests/projects/output-general/videosynth_ntsc_dropout_scratch_ramp.meta

sections:

  - name: Scale00
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8

  - name: Scale01
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8
    dropouts:
      scratch:
        scale: 1

  - name: Scale02
