project:
  name: NtscOsdTestFixture
  version: "1.0"
  description: NTSC OSD overlay test — static labels and per-frame token burn-in for visual inspection in decode-orc

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output-general/videosynth_ntsc_osd_test.composite
  metadata_path: tests/projects/output-general/videosynth_ntsc_osd_test.meta

sections:
  - name: NtscOsdTestBars
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC000"
          - code_type: fm_picture_number
            start_value: 1
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    osd:
      overlays:
        - text: "NtscOsdTestBars"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0
        - text: "PN:{picture_number} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: NtscOsdTestTartan
    type: progressive
    source: videosynth-assets/assets/exr/720x486/TARTAN.exr
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC000"
          - code_type: fm_picture_number
            start_value: 9
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    osd:
      overlays:
        - text: "NtscOsdTestTartan"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0
        - text: "PN:{picture_number} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: NtscOsdTestMultiBurst
    type: progressive
    source: videosynth-assets/assets/exr/720x486/MULTIBURST.exr
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC000"
          - code_type: fm_picture_number
            start_value: 17
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    osd:
      overlays:
        - text: "NtscOsdTestMultiBurst"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0
        - text: "PN:{picture_number} PHASE:{phase_id} SEC:{section_name}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: NtscOsdTestRamps
    type: progressive
    source: videosynth-assets/assets/exr/720x486/Y_CB_CR_RAMPS.exr
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC000"
          - code_type: fm_picture_number
            start_value: 25
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    osd:
      overlays:
        - text: "NtscOsdTestRamps"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0
        - text: "PN:{picture_number} HEX:{biphase_hex}"
          x: 8
