# PAL Dropout Ramp (Combined Random + Scratch)
#
# 21 sections × 8 frames; both random and scratch dropout scales step together
# from 0 (none) through 20 (maximum).
#
# Scale mapping summary (see dropout-injection-design.md §Scale Mapping):
#   Scale  1 → random ~0.05 events/frame, max 5 samples;  1 scratch, max 2 frames
#   Scale 10 → random ~2.8 events/frame,  max 282 samples; 8 scratches, max ~113 frames
#   Scale 20 → random 100 events/frame,   max 2000 samples; 15 scratches, max 500 frames

project:
  name: PalDropoutRamp
  version: "1.0"
  description: PAL combined dropout ramp — random and scratch scale 0 through 20

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output-general/composite/videosynth_pal_dropout_ramp.composite
  metadata_path: tests/projects/output-general/composite/videosynth_pal_dropout_ramp.meta

sections:

  - name: Scale00
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8

  - name: Scale01
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    dropouts:
      random:
        scale: 1
      scratch:
        scale: 1

  - name: Scale02
