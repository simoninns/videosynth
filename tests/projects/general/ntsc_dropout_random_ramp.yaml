# NTSC Random Dropout Ramp
#
# 21 sections × 8 frames; random dropout scale steps from 0 (none) through
# 20 (maximum). Scratch dropouts absent — isolates the Poisson random model.
#
# Scale mapping (see dropout-injection-design.md §Scale Mapping):
#   Scale  1 → ~0.05 events/frame, max run 5 samples
#   Scale 10 → ~2.8 events/frame,  max run 282 samples
#   Scale 20 → 100 events/frame,   max run 2000 samples

project:
  name: NtscDropoutRandomRamp
  version: "1.0"
  description: NTSC random dropout ramp — scale 0 through 20 (random only)

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output-general/composite/videosynth_ntsc_dropout_random_ramp.composite
  metadata_path: tests/projects/output-general/composite/videosynth_ntsc_dropout_random_ramp.meta

sections:

  - name: Scale00
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8

  - name: Scale01
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8
    dropouts:
      random:
        scale: 1

  - name: Scale02
