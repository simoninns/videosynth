project:
  name: NtscBiphaseCavFixture
  version: "1.0"
  description: NTSC CAV laserdisc biphase fixture — 8 programme chapters with varied content and programme_status; VIRS on lines 19/282 per IEC 60857 §9.1.3

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output-general/composite/videosynth_ntsc_biphase_cav.composite
  metadata_path: tests/projects/output-general/composite/videosynth_ntsc_biphase_cav.meta

sections:
  - name: NtscCavLeadIn
    type: progressive
    source: videosynth-assets/assets/exr/720x486/75_BARS.exr
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: lead_in
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x80D234"
      - type: vits
        target_lines: [19, 282]
        vits_type: virs

  - name: NtscCavProgrammeChapter0
