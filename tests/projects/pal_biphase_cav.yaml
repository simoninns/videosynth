project:
  name: PalBiphaseCavFixture
  version: "1.0"
  description: PAL CAV laserdisc biphase fixture — 8 programme chapters with varied content and programme_status

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: tests/projects/output/videosynth_pal_biphase_cav.composite
  metadata_path: tests/projects/output/videosynth_pal_biphase_cav.meta

sections:
  - name: PalCavLeadIn
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: lead_in
          - code_type: users_code
            users_code: "0x80D234"

  - name: PalCavProgrammeChapter0
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: chapter_number
            chapter: 0
          - code_type: picture_stop
          - code_type: programme_status
            programme_status: "0x8DC000"

  - name: PalCavProgrammeChapter1
