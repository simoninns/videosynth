# PAL Noise Ramp Example
#
# 10 sections × 8 frames each, progressing from clean to near-sync-limit.
# Demonstrates the two-component Gaussian noise model:
#   - noise_db sets the Black PSNR target (floor noise)
#   - noise_spread_db makes white 4 dB noisier than black (White SNR = noise_db - 4)
#
# All sections include a uk-national VITS injection on frame line 19 so that
# orc-gui can measure both Black PSNR (VBI blanking window, line 22 field-rel)
# and White SNR (white-flag window, line 19 field-rel) for every section.
#
# Expected orc-gui readings:
#   Section         | noise_db | noise_spread_db | Black PSNR | White SNR
#   CleanReference  | —        | —               | —          | —
#   NearQuantisation| 58.0     | 4.0             | ~58 dB     | ~54 dB
#   ExcellentSource | 53.0     | 4.0             | ~53 dB     | ~49 dB
#   GoodSource      | 48.0     | 4.0             | ~48 dB     | ~44 dB
#   FairSource      | 43.0     | 4.0             | ~43 dB     | ~39 dB
#   TypicalVhs      | 38.0     | 4.0             | ~38 dB     | ~34 dB
#   PoorTape        | 33.0     | 4.0             | ~33 dB     | ~29 dB
#   VeryPoor        | 28.0     | 4.0             | ~28 dB     | ~24 dB
#   BarelyWatchable | 24.0     | 4.0             | ~24 dB     | ~20 dB
#   SyncBorderline  | 20.0     | 0.0             | ~20 dB     | ~20 dB
#
# Measured values will vary ±0.5–1.0 dB per field due to finite window size.

project:
  name: PalNoiseRamp
  version: "1.0"
  description: PAL noise ramp — clean to sync-borderline in 10 sections

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output/videosynth_pal_noise_ramp.composite
  metadata_path: tests/projects/output/videosynth_pal_noise_ramp.meta

sections:

  # ---------------------------------------------------------------------------
  # Section 1: clean reference — no noise injection
  # ---------------------------------------------------------------------------
  - name: CleanReference
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 2: near-quantisation (excellent digital source with slight noise)
  # ---------------------------------------------------------------------------
  - name: NearQuantisation
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 58.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 3: excellent laserdisc / broadcast source
  # ---------------------------------------------------------------------------
  - name: ExcellentSource
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 53.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 4: good laserdisc
  # ---------------------------------------------------------------------------
  - name: GoodSource
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 5: fair laserdisc / good VHS
  # ---------------------------------------------------------------------------
  - name: FairSource
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 6: typical VHS
  # ---------------------------------------------------------------------------
  - name: TypicalVhs
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 38.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 7: poor tape / worn VHS
  # ---------------------------------------------------------------------------
  - name: PoorTape
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 8: very poor tape
  # ---------------------------------------------------------------------------
  - name: VeryPoor
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 28.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 9: barely watchable
  # ---------------------------------------------------------------------------
  - name: BarelyWatchable
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 24.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]

  # ---------------------------------------------------------------------------
  # Section 10: sync borderline — spread=0 because White SNR is at the floor
  # ---------------------------------------------------------------------------
  - name: SyncBorderline
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    noise:
      noise_db: 20.0
      noise_spread_db: 0.0
    line_injections:
      - type: vits
        vits_type: uk-national
        target_lines: [19]
