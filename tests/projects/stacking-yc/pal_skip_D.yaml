# PAL Skip Test — Source D (seed 8008)
#
# Simulates a capture with a backward skip at PN 15 (replaying PNs 11–15) and
# a forward skip at PN 34 (PNs 34–35 absent).
#
# Output stream: PNs 1–15, PNs 11–15 (replay), PNs 16–33, PNs 36–40
#   — 43 frames total.
# All 40 disc frames are generated to maintain burst-phase continuity.
#
# Content layout (identical across A–D):
#   PNs  1– 8:  75_BARS.exr
#   PNs  9–16:  TESTCARD-F.exr
#   PNs 17–24:  MULTIBURST.exr
#   PNs 25–32:  TARTAN.exr
#   PNs 33–40:  Y_CB_CR_RAMPS.exr
#
# Noise/dropout: moderate, seed 8008.
# Skips:
#   backward at PN 15, count 5 → PNs 11–15 replayed after PN 15
#   forward  at PN 34, count 2 → PNs 34–35 withheld from output

project:
  name: PalSkipD
  version: "1.0"
  description: PAL skip-test source D — seed 8008, backward skip at PN 15, forward skip at PN 34

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: tests/projects/output-stacking/yc/videosynth_pal_skip_D.y
  signal_type: yc

sections:

  - name: Bars_D
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 8008
    dropouts:
      random:
        scale: 8
        seed: 8008
      scratch:
        scale: 8
        seed: 8008
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Testcard_D
    type: progressive
    source: videosynth-assets/assets/exr/720x576/TESTCARD-F.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 8008
    dropouts:
      random:
        scale: 8
        seed: 8008
      scratch:
        scale: 8
        seed: 8008
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: MultiBurst_D
    type: progressive
    source: videosynth-assets/assets/exr/720x576/MULTIBURST.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 8008
    dropouts:
      random:
        scale: 8
        seed: 8008
      scratch:
        scale: 8
        seed: 8008
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Tartan_D
    type: progressive
    source: videosynth-assets/assets/exr/720x576/TARTAN.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 8008
    dropouts:
      random:
        scale: 8
        seed: 8008
      scratch:
        scale: 8
        seed: 8008
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Ramps_D
    type: progressive
    source: videosynth-assets/assets/exr/720x576/Y_CB_CR_RAMPS.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 8008
    dropouts:
      random:
        scale: 8
        seed: 8008
      scratch:
        scale: 8
        seed: 8008
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
