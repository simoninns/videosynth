project:
  name: PAL32ColourBars
  version: "1.0"
  description: PAL regression fixture with 32 frames

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: /tmp/videosynth_pal_32f_colour_bars.composite
  metadata_path: /tmp/videosynth_pal_32f_colour_bars.meta

sections:
  - name: PALBars
    type: software_generated
    pattern: ebu_colour_bars
    duration_frames: 32
