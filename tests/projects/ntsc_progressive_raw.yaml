project:
  name: NTSCProgressiveRawFixture
  version: "1.0"
  description: NTSC progressive RAW fixture

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output/videosynth_ntsc_progressive_raw.composite
  metadata_path: tests/projects/output/videosynth_ntsc_progressive_raw.meta

sections:
