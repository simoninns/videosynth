project:
  name: NTSC32Grayscale
  version: "1.0"
  description: NTSC regression fixture with 32 frames

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: /tmp/videosynth_ntsc_32f_grayscale.composite
  metadata_path: /tmp/videosynth_ntsc_32f_grayscale.meta

sections:
  - name: NTSCRamp
    type: software_generated
    pattern: grayscale_ramp_horizontal
    duration_frames: 32
