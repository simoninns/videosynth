    type: progressive
    source: videosynth-assets/assets/exr/720x576/MULTIBURST.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 7007
    dropouts:
      random:
        scale: 8
        seed: 7007
      scratch:
        scale: 8
        seed: 7007
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
