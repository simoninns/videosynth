disc_skips:
  # Skip PNs 1–4: capture starts at PN 5.
  - at_frame: 1
    direction: forward
    count: 4
  # Skip PNs 30–32: player jumps from PN 29 to PN 33.
  - at_frame: 30
    direction: forward
    count: 3
