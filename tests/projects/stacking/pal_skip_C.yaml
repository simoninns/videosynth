# PAL Skip Test — Source C (seed 7007)
#
# Simulates a capture that starts at PN 5 (PNs 1–4 not captured) and has a
# forward skip: PNs 30–32 are absent (player jumps from PN 29 to PN 33).
#
# Output stream: PNs 5–29, PNs 33–40 — 33 frames total.
# All 40 disc frames are generated to maintain burst-phase continuity.
#
# Content layout (identical across A–D):
#   PNs  1– 8:  75_BARS.exr
#   PNs  9–16:  TESTCARD-F.exr
#   PNs 17–24:  MULTIBURST.exr
#   PNs 25–32:  TARTAN.exr
#   PNs 33–40:  Y_CB_CR_RAMPS.exr
#
# Noise/dropout: moderate, seed 7007.
# Skips:
#   forward at PN  1, count 4 → PNs 1–4 withheld from output
#   forward at PN 30, count 3 → PNs 30–32 withheld from output

project:
  name: PalSkipC
  version: "1.0"
  description: PAL skip-test source C — seed 7007, start PN 5, forward skip at PN 30

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: tests/projects/output-stacking/composite/videosynth_pal_skip_C.composite

sections:

  - name: Bars_C
    type: progressive
    source: videosynth-assets/assets/exr/720x576/75_BARS.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 7007
    dropouts:
      random:
        scale: 8
        seed: 7007
      scratch:
        scale: 8
        seed: 7007
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Testcard_C
    type: progressive
    source: videosynth-assets/assets/exr/720x576/TESTCARD-F.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 7007
    dropouts:
      random:
        scale: 8
        seed: 7007
      scratch:
        scale: 8
        seed: 7007
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
