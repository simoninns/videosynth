  - name: Ramps_B
    type: progressive
    source: videosynth-assets/assets/exr/720x576/Y_CB_CR_RAMPS.exr
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 6006
    dropouts:
      random:
        scale: 8
        seed: 6006
      scratch:
        scale: 8
        seed: 6006
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
