          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

disc_skips:
  # Skip PNs 1–2: capture starts at PN 3.
  - at_frame: 1
    direction: forward
    count: 2
  # After PN 25, rewind and replay PNs 23–25 as bit-identical copies.
  - at_frame: 25
    direction: backward
    count: 3
  # Skip PNs 39–40: capture ends at PN 38.
  - at_frame: 39
    direction: forward
    count: 2
