project:
  name: NtscBiphaseClvFixture
  version: "1.0"
  description: NTSC CLV laserdisc biphase fixture — exercises all CLV and FM code types; mandatory VIRS on lines 19/282 per IEC 60857 §9.1.3

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: tests/projects/output/videosynth_ntsc_biphase_clv.composite
  metadata_path: tests/projects/output/videosynth_ntsc_biphase_clv.meta

sections:
  # Lead-in: CLV has no minimum frame count constraint; 100 frames used here.
  # FM white flag injected alongside the 24-bit lead_in code per IEC 60857 §10.
  # VIRS on lines 19/282 is mandatory for NTSC laserdisc (IEC 60857 §9.1.3).
  - name: NtscClvLeadIn
    type: progressive
    source: videosynth-assets/assets/exr/720x486/100_BARS.exr
    duration_frames: 100
    section_type: lead_in
    line_injections:
      - type: laserdisc
        disc_type: CLV
        codes:
          - code_type: lead_in
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x801234"
      - type: vits
        target_lines: [19, 282]
        vits_type: virs

  # Programme area — chapter 0.
  # Exercises all NTSC CLV programme codes: programme_time_code, clv_code,
  # clv_picture_number, chapter_number, programme_status, fm_programme_time,
  # and fm_white_flag.  users_code is lead_in/lead_out only per IEC Appendix D.
  - name: NtscClvProgrammeChapter0
    type: progressive
    source: videosynth-assets/assets/exr/720x486/100_BARS.exr
    duration_frames: 1800
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CLV
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 0
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_programme_time
          - code_type: fm_white_flag
      - type: vits
        target_lines: [19, 282]
        vits_type: virs

  # Programme area — chapter 1.
  # Verifies chapter_number advances while CLV timecodes and FM codes continue.
  - name: NtscClvProgrammeChapter1
    type: progressive
    source: videosynth-assets/assets/exr/720x486/100_BARS.exr
    duration_frames: 1800
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CLV
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_programme_time
          - code_type: fm_white_flag
      - type: vits
        target_lines: [19, 282]
        vits_type: virs

  # Lead-out: CLV has no minimum frame count constraint.
  - name: NtscClvLeadOut
    type: progressive
    source: videosynth-assets/assets/exr/720x486/100_BARS.exr
    duration_frames: 100
    section_type: lead_out
    line_injections:
      - type: laserdisc
        disc_type: CLV
        codes:
          - code_type: lead_out
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x870000"
      - type: vits
        target_lines: [19, 282]
        vits_type: virs
