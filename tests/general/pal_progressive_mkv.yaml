project:
  name: PALProgressiveMkvFixture
  version: "1.0"
  description: PAL progressive MKV fixture

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/../general-output/videosynth_pal_progressive_mkv.composite"

sections:
  - name: PalMkvMovingZone
    type: progressive
    source: "{bundled}/mkv/720x576/MOVING_ZONE_2H.mkv"
    duration_frames: all
  - name: PalMkvSmpteBars
    type: progressive
    source: "{bundled}/mkv/720x576/SMPTE_BARS.mkv"
    duration_frames: all