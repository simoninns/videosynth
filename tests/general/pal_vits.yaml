project:
  name: PALVitsFixture
  version: "1.0"
  description: PAL VITS fixture

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/../general-output/videosynth_pal_vits.composite"

line_injections:
  vits:
    - vits_type: vits17
      target_lines: [17]
    - vits_type: itu-multiburst
      target_lines: [18]
    - vits_type: uk-national
      target_lines: [19]
    - vits_type: vits20
      target_lines: [20]
    - vits_type: itu-composite
      target_lines: [330]
    - vits_type: itu-combination
      target_lines: [331]

sections:
  - name: PalVits
    type: progressive
    source: "{bundled}/exr/720x576/100_BARS.exr"
    duration_frames: 1