# NTSC Skip Test — Source A (seed 1001)
#
# Simulates a 40-frame CAV NTSC disc (PNs 1–40) with a backward skip at PN 20:
# the player rewinds after PN 20 and replays PNs 17–20 a second time.
# Output stream: PNs 1–20, PNs 17–20 (replay), PNs 21–40 — 44 frames total.
#
# All four sources share the same disc content layout and picture numbers so
# that burst phase and colour-frame index are identical for any given PN across
# all sources, enabling stacking evaluation in decode-orc.
#
# Content layout (identical across A–D):
#   PNs  1– 8:  75_BARS.exr
#   PNs  9–16:  SMPTE_BARS_001.exr
#   PNs 17–24:  MULTIBURST.exr
#   PNs 25–32:  TARTAN.exr
#   PNs 33–40:  Y_CB_CR_RAMPS.exr
#
# Noise/dropout: moderate, seed 1001.
# Skip: backward at PN 20, count 4 → replay PNs 17–20 as bit-identical copies.

project:
  name: NtscSkipA
  version: "1.0"
  description: NTSC skip-test source A — seed 1001, backward skip at PN 20

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/../stacking-yc-output/videosynth_ntsc_skip_A.y"
  signal_type: yc

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  - name: Bars_A
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 1001
    dropouts:
      random:
        scale: 8
        seed: 1001
      scratch:
        scale: 8
        seed: 1001
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  - name: Testcard_A
    type: progressive
    source: "{bundled}/exr/720x486/SMPTE_BARS_001.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 1001
    dropouts:
      random:
        scale: 8
        seed: 1001
      scratch:
        scale: 8
        seed: 1001
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  - name: MultiBurst_A
    type: progressive
    source: "{bundled}/exr/720x486/MULTIBURST.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 1001
    dropouts:
      random:
        scale: 8
        seed: 1001
      scratch:
        scale: 8
        seed: 1001
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  - name: Tartan_A
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 1001
    dropouts:
      random:
        scale: 8
        seed: 1001
      scratch:
        scale: 8
        seed: 1001
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  - name: Ramps_A
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 1001
    dropouts:
      random:
        scale: 8
        seed: 1001
      scratch:
        scale: 8
        seed: 1001
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

disc_skips:
  # After PN 20, rewind and replay PNs 17–20 as bit-identical copies.
  - at_frame: 20
    direction: backward
    count: 4
