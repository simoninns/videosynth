# PAL Disc Simulation — Source C (seed 3003)
#
# Simulates a capture starting at PN 3 (PNs 1–2 not captured).
# Includes a backward skip: after PN 12 the player rewinds and replays PNs 9–16.
# Includes a forward skip: after PN 28 the player jumps to PN 31.
# PNs 29 and 30 are absent; Frame Map must detect the gap and pad.
# 40 frames total (4 backward-skip duplicates, 2-frame forward gap).
#
# Content layout (matches all four sources):
#   PNs  1–8:  100_BARS.exr   (source C starts at PN 3 → 6 frames)
#   PNs  9–16: TESTCARD-F.exr (backward skip: 9–12 first play, 9–16 replay)
#   PNs 17–24: MULTIBURST.exr
#   PNs 25–32: TARTAN.exr     (forward skip: 25–28 played, gap 29–30, resume 31–32)
#   PNs 33–40: Y_CB_CR_RAMPS.exr
#
# Noise/dropout: light — noise_db 48.0, scale 6, seed 3003.
# Backward skip: Testcard_PreSkip_C → Testcard_Replay_C (noise_seed 9903).
# Forward skip: Tartan_PreGap_C (25–28) → Tartan_PostGap_C (start_value 31).

project:
  name: PalDiscSimC
  version: "1.0"
  description: PAL disc simulation source C — seed 3003, start PN 3, backward + forward skips

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: "{project}/../stacking-yc-output/videosynth_pal_discsim_C_clean.cvbsy"
  signal_type: yc

line_injections:
  disc_type: CAV
  vits:
    - vits_type: uk-national
      target_lines: [19]

sections:

  # ---------------------------------------------------------------------------
  # PNs 3–8: 100% colour bars (source starts at PN 3; PNs 1–2 absent)
  # ---------------------------------------------------------------------------
  - name: Bars_C
    type: progressive
    source: "{bundled}/exr/720x576/100_BARS.exr"
    duration_frames: 6
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 3
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 9–12: UK test card F (first play; player rewinds after PN 12)
  # ---------------------------------------------------------------------------
  - name: Testcard_PreSkip_C
    type: progressive
    source: "{bundled}/exr/720x576/TESTCARD-F.exr"
    duration_frames: 4
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 9–16: UK test card F replay (backward skip — same start_value, fresh noise)
  # ---------------------------------------------------------------------------
  - name: Testcard_Replay_C
    type: progressive
    source: "{bundled}/exr/720x576/TESTCARD-F.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 17–24: multi-burst
  # ---------------------------------------------------------------------------
  - name: MultiBurst_C
    type: progressive
    source: "{bundled}/exr/720x576/MULTIBURST.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 25–28: tartan (player skips forward after PN 28)
  # ---------------------------------------------------------------------------
  - name: Tartan_PreGap_C
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 4
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 31–32: tartan resumed after forward skip (gap of 2: PNs 29–30 absent)
  # ---------------------------------------------------------------------------
  - name: Tartan_PostGap_C
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 2
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 31
          - code_type: programme_status
            programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # PNs 33–40: YCbCr ramps
  # ---------------------------------------------------------------------------
  - name: Ramps_C
    type: progressive
    source: "{bundled}/exr/720x576/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC000"