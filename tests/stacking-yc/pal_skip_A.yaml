# PAL Skip Test — Source A (seed 5005)
#
# Simulates a 40-frame CAV PAL disc (PNs 1–40) with a backward skip at PN 20:
# the player rewinds after PN 20 and replays PNs 17–20 a second time.
# Output stream: PNs 1–20, PNs 17–20 (replay), PNs 21–40 — 44 frames total.
#
# All four sources share the same disc content layout and picture numbers so
# that burst phase and colour-frame index are identical for any given PN across
# all sources, enabling stacking evaluation in decode-orc.
#
# Content layout (identical across A–D):
#   PNs  1– 8:  75_BARS.exr
#   PNs  9–16:  TESTCARD-F.exr
#   PNs 17–24:  MULTIBURST.exr
#   PNs 25–32:  TARTAN.exr
#   PNs 33–40:  Y_CB_CR_RAMPS.exr
#
# Noise/dropout: moderate, seed 5005.
# Skip: backward at PN 20, count 4 → replay PNs 17–20 as bit-identical copies.

project:
  name: PalSkipA
  version: "1.0"
  description: PAL skip-test source A — seed 5005, backward skip at PN 20

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: "{project}/../stacking-yc-output/videosynth_pal_skip_A.y"
  signal_type: yc

sections:

  - name: Bars_A
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 5005
    dropouts:
      random:
        scale: 8
        seed: 5005
      scratch:
        scale: 8
        seed: 5005
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Testcard_A
    type: progressive
    source: "{bundled}/exr/720x576/TESTCARD-F.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 5005
    dropouts:
      random:
        scale: 8
        seed: 5005
      scratch:
        scale: 8
        seed: 5005
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: MultiBurst_A
    type: progressive
    source: "{bundled}/exr/720x576/MULTIBURST.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 5005
    dropouts:
      random:
        scale: 8
        seed: 5005
      scratch:
        scale: 8
        seed: 5005
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
        vits_type: uk-national
        target_lines: [19]
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Tartan_A
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 5005
    dropouts:
      random:
        scale: 8
        seed: 5005
      scratch:
        scale: 8
        seed: 5005
    line_injections:
      - type: laserdisc
        disc_type: CAV
