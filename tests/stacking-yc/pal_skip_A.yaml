    dropouts:
      random:
        scale: 8
        seed: 5005
      scratch:
        scale: 8
        seed: 5005
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC000"
      - type: vits
