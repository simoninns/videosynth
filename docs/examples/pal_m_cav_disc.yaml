# PAL-M CAV LaserDisc — demonstration
#
# PAL-M (System M line structure with PAL colour, 525 lines ~60 Hz) uses the
# 486-line raster like NTSC and, like NTSC, requires both 24-bit biphase and
# 40-bit FM codes plus a VIRS colour reference on every laserdisc section
# (IEC 60857 §9.1.3). This runnable CAV disc demonstrates:
#   - 24-bit biphase: picture_number, chapter_number, picture_stop,
#     programme_status, users_code
#   - 40-bit FM: fm_picture_number, fm_white_flag
#   - virs VITS on lines 19/282
#   - an OSD label and light source noise on a programme chapter
#
# See docs/user/biphase-design.md for full documentation.

project:
  name: PalMCavShowcase
  version: "1.0"
  description: PAL-M CAV LaserDisc showcase — biphase + FM codes, VIRS, OSD, noise

cvbs_presets:
  video_standard_preset: PAL_M
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/pal_m_cav_showcase.composite"

sections:

  - name: LeadIn
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: lead_in
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x80D234"
      - type: vits
        vits_type: virs
        target_lines: [19, 282]

  - name: Chapter0Bars
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: chapter_number
            chapter: 0
          - code_type: picture_stop
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    osd:
      overlays:
        - text: "PAL-M CAV Chapter0"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0

  - name: Chapter1Ramps
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0

  - name: LeadOut
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_out
    line_injections:
      - type: laserdisc
        disc_type: CAV
        codes:
          - code_type: lead_out
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x87D000"
      - type: vits
        vits_type: virs
        target_lines: [19, 282]
