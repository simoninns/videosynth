# NTSC CLV LaserDisc — demonstration
#
# A complete, runnable NTSC CLV disc master demonstrating the CLV code family
# together with the NTSC-mandatory FM codes and VIRS:
#   - 24-bit biphase CLV: programme_time_code, clv_code, clv_picture_number,
#     chapter_number, programme_status, users_code
#   - 40-bit FM: fm_programme_time (lines 10/273), fm_white_flag (lines 11/274)
#   - virs VITS on every section (mandatory on NTSC laserdisc)
#   - an OSD label and light source noise on a programme chapter
#
# NTSC CLV colour time error correction (IEC 60857 Amendment 2 §10.1.10) is
# handled transparently: the clv_picture_number seconds count jumps forward at
# specific accumulated frame counts to maintain colour timing accuracy.
#
# See docs/user/biphase-design.md for full documentation.

project:
  name: NtscClvShowcase
  version: "1.0"
  description: NTSC CLV LaserDisc showcase — CLV + FM codes, VIRS, OSD, noise

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/ntsc_clv_showcase.composite"

line_injections:
  disc_type: CLV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  - name: LeadIn
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_in
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x80D234"
  - name: Chapter0Bars
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 0
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_programme_time
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "NTSC CLV Chapter0"
          x: 8
          y: 8
          scale: 2
          fg_luma: white
          bg_luma: black

  - name: Chapter1Ramps
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_programme_time
          - code_type: fm_white_flag
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0

  - name: LeadOut
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_out
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_out
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x87D000"