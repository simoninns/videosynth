# PAL CAV LaserDisc — comprehensive demonstration
#
# A complete, runnable PAL CAV disc master (lead-in, programme chapters,
# lead-out) that layers the signal-processing features on top of the biphase
# codes so a single project exercises most of the application at once:
#   - CAV biphase codes: picture_number (continuous across chapters),
#     chapter_number (automatic stop-bit management), picture_stop freeze
#     markers, programme_status, users_code in lead-in/lead-out
#   - PAL laserdisc pilot burst (IEC 60856 §9.1.2) on every sync pulse
#   - uk-national VITS on frame line 19
#   - On-screen display overlays (static labels and per-frame tokens)
#   - Two-component Gaussian noise and random/scratch dropout impairments
#   - Frame-locked synthetic audio (fixed tone and a section-spanning sweep)
#   - Progressive EXR and MKV sources
#
# Paths use logical asset roots: {bundled} is the installed asset library,
# {project} is this file's directory. The metadata sidecar and the audio WAV
# are always written alongside the video output.
#
# Durations are kept short (8 frames/section) so the demo generates quickly.
# IEC track-pitch minimums (lead-in >= 938, lead-out >= 1250, chapters >= 30
# frames) apply to production masters and are surfaced as validator warnings.
#
# CVBS_S16_FSC preserves the full pilot-burst waveform (its trough reaches
# -600 mV, below the -300 mV legal-code floor of the U10/U16/TPG21 presets).
#
# See docs/user/biphase-design.md for full documentation.

project:
  name: PalCavShowcase
  version: "1.0"
  description: PAL CAV LaserDisc showcase — biphase, pilot burst, VITS, OSD, noise, dropouts, audio

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_S16_FSC
  signal_state_preset: STANDARD_TBC_LOCKED
  pal_laserdisc_pilot_burst: true

output:
  video_path: "{project}/output/pal_cav_showcase.composite"

line_injections:
  disc_type: CAV
  vits:
    - vits_type: uk-national
      target_lines: [19]

sections:

  # Lead-in: lead_in marker plus a manufacturer users_code.
  - name: LeadIn
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_in
          - code_type: users_code
            users_code: "0x80D234"

  # Chapter 0: picture_stop freeze marker, OSD label + per-frame tokens,
  # uk-national VITS, and a fixed 1 kHz audio tone.
  - name: Chapter0Bars
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: chapter_number
            chapter: 0
          - code_type: picture_stop
          - code_type: programme_status
            programme_status: "0x8DC000"
    osd:
      overlays:
        - text: "Chapter0Bars"
          x: 8
          y: 8
          scale: 2
          fg_luma: 1.0
          bg_luma: 0.0
        - text: "PN:{picture_number} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0
    audio:
      channel_pairs:
        - pair: 0
          description: Analogue stereo
          left:  { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }

  # Chapter 1: fair-quality source noise plus random dropouts, MKV source.
  - name: Chapter1Motion
    type: progressive
    source: "{bundled}/mkv/720x576/MOVING_ZONE_2H.mkv"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC100"
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
    dropouts:
      random:
        scale: 8

  # Chapter 2: scratch dropouts and a section-spanning audio sweep.
  - name: Chapter2Ramps
    type: progressive
    source: "{bundled}/exr/720x576/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: chapter_number
            chapter: 2
          - code_type: picture_stop
          - code_type: programme_status
            programme_status: "0x8BA000"
    dropouts:
      scratch:
        scale: 6
    audio:
      channel_pairs:
        - pair: 0
          left:
            waveform: sawtooth
            amplitude: 0.5
            ramp: { start: 200.0, end: 4000.0, mode: up }
        - pair: 1
          description: Commentary
          left: { waveform: sine, frequency: 660.0, amplitude: 0.4 }

  # Lead-out: lead_out marker plus users_code.
  - name: LeadOut
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: lead_out
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_out
          - code_type: users_code
            users_code: "0x87D000"
