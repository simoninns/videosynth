# PAL CLV LaserDisc — demonstration
#
# A complete, runnable PAL CLV disc master demonstrating the CLV biphase code
# family and time-based addressing:
#   - programme_time_code (auto-increments once per minute)
#   - clv_code identification marker
#   - clv_picture_number (auto-increments every frame, tracks seconds/frames)
#   - chapter_number with CLV line placement, programme_status, users_code
#   - uk-national VITS, an OSD label, and light source noise on a programme
#     chapter
#
# On CLV discs the picture counters auto-increment; no start_value is needed.
# Durations are short (8 frames/section) so the demo generates quickly; the
# validator warns where they fall below IEC track-pitch minimums.
#
# See docs/user/biphase-design.md for full documentation.

project:
  name: PalClvShowcase
  version: "1.0"
  description: PAL CLV LaserDisc showcase — CLV codes, VITS, OSD, noise

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/pal_clv_showcase.composite"

line_injections:
  disc_type: CLV
  vits:
    - vits_type: uk-national
      target_lines: [19]

sections:

  - name: LeadIn
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_in
          - code_type: users_code
            users_code: "0x80D234"

  - name: Chapter0Bars
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 0
          - code_type: programme_status
            programme_status: "0x8DC001"
    osd:
      overlays:
        - text: "TC {timecode} F{frame_number}"
          x: 8
          y: 8
          scale: 2
          fg_luma: white
          bg_luma: black

  - name: Chapter1Ramps
    type: progressive
    source: "{bundled}/exr/720x576/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: programme_time_code
          - code_type: clv_code
          - code_type: clv_picture_number
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC002"
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0

  - name: LeadOut
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    section_type: lead_out
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_out
          - code_type: users_code
            users_code: "0x87D000"
