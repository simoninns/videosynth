# PAL signal features — non-laserdisc demonstration
#
# A runnable progressive-source PAL project (no laserdisc codes) that showcases
# the signal-generation and impairment features across its sections:
#   - The full PAL VITS set on their standard frame lines
#     (vits17, itu-multiburst, uk-national, vits20, itu-composite,
#      itu-combination)
#   - Two-component Gaussian noise at several quality levels
#   - Random (Poisson) and scratch (triangular-envelope) dropouts
#   - Frame-locked synthetic audio: fixed tone, a section-spanning sweep, and a
#     silence gap (a section with no audio: block still emits aligned samples)
#   - On-screen display overlays with per-frame tokens
#   - Progressive EXR and MKV sources
#
# The uk-national white-flag VITS on frame line 19 lets an analyser measure
# White SNR in the noise sections; the VBI blanking window gives Black PSNR.

project:
  name: PalSignalFeatures
  version: "1.0"
  description: PAL non-laserdisc showcase — full VITS set, noise, dropouts, audio, OSD

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/pal_signal_features.composite"

line_injections:
  vits:
    - vits_type: vits17
      target_lines: [17]
    - vits_type: itu-multiburst
      target_lines: [18]
    - vits_type: uk-national
      target_lines: [19]
    - vits_type: vits20
      target_lines: [20]
    - vits_type: itu-composite
      target_lines: [330]
    - vits_type: itu-combination
      target_lines: [331]

sections:

  # Full PAL VITS reference on the standard insertion lines.
  - name: VitsReference
    type: progressive
    source: "{bundled}/exr/720x576/100_BARS.exr"
    duration_frames: 8
  # Good-quality source: light noise plus a fixed 1 kHz tone.
  - name: GoodSource
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0
    audio:
      channel_pairs:
        - pair: 0
          description: Analogue stereo
          left:  { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
        - pair: 1
          description: Commentary (left only)
          left:  { waveform: square, frequency: 660.0, amplitude: 0.4 }

  # Poor-quality source with random dropouts and an OSD label.
  - name: PoorSourceRandomDropouts
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 8
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
    dropouts:
      random:
        scale: 10
    osd:
      overlays:
        - text: "SEC:{section_name} PHASE:{phase_id}"
          x: 8
          y: 8
          scale: 1
          fg_luma: white
          bg_luma: black

  # Scratch dropouts over a ramp source.
  - name: ScratchDropouts
    type: progressive
    source: "{bundled}/exr/720x576/LUMA_RAMP.exr"
    duration_frames: 8
    dropouts:
      scratch:
        scale: 4
  # Silence gap: no audio: block, but the WAV still advances by the exact
  # per-frame sample count so it stays frame-locked.
  - name: SilenceGap
    type: progressive
    source: "{bundled}/exr/720x576/PLUGE.exr"
    duration_frames: 8

  # Section-spanning sawtooth audio sweep over an MKV source.
  - name: AudioSweep
    type: progressive
    source: "{bundled}/mkv/720x576/MOVING_ZONE_2H.mkv"
    duration_frames: 8
    audio:
      channel_pairs:
        - pair: 0
          left:
            waveform: sawtooth
            amplitude: 0.5
            ramp: { start: 200.0, end: 4000.0, mode: up }
