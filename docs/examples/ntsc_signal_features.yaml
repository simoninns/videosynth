# NTSC signal features — non-laserdisc demonstration
#
# A runnable progressive-source NTSC project (no laserdisc codes) that showcases
# the signal-generation and impairment features across its sections:
#   - The full NTSC VITS set on their standard frame lines
#     (ntc7-composite, fcc-multiburst, virs, ntc7-combination, fcc-composite)
#   - Two-component Gaussian noise at several quality levels
#   - Random (Poisson) and scratch (triangular-envelope) dropouts
#   - Frame-locked synthetic audio (fixed tone, square tone, silence gap)
#   - On-screen display overlays with per-frame tokens
#   - Progressive EXR and MKV sources
#
# These ntc7/fcc VITS types are valid on a plain NTSC signal but are rejected on
# NTSC laserdisc discs, where lines 10-18 / 273-281 are reserved for biphase.

project:
  name: NtscSignalFeatures
  version: "1.0"
  description: NTSC non-laserdisc showcase — full VITS set, noise, dropouts, audio, OSD

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/ntsc_signal_features.composite"

sections:

  # Full NTSC VITS reference on the standard insertion lines.
  - name: VitsReference
    type: progressive
    source: "{bundled}/exr/720x486/100_BARS.exr"
    duration_frames: 8
    line_injections:
      - type: vits
        vits_type: ntc7-composite
        target_lines: [17]
      - type: vits
        vits_type: fcc-multiburst
        target_lines: [18]
      - type: vits
        vits_type: virs
        target_lines: [21]
      - type: vits
        vits_type: ntc7-combination
        target_lines: [280]
      - type: vits
        vits_type: fcc-composite
        target_lines: [281]

  # Good-quality source: light noise plus a fixed 1 kHz tone.
  - name: GoodSource
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0
    line_injections:
      - type: vits
        vits_type: virs
        target_lines: [21]
    audio:
      channel_pairs:
        - pair: 0
          description: Analogue stereo
          left:  { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
        - pair: 1
          description: Commentary (left only)
          left:  { waveform: square, frequency: 660.0, amplitude: 0.4 }

  # Poor-quality source with random dropouts and an OSD label.
  - name: PoorSourceRandomDropouts
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
    dropouts:
      random:
        scale: 10
    line_injections:
      - type: vits
        vits_type: virs
        target_lines: [21]
    osd:
      overlays:
        - text: "SEC:{section_name} PHASE:{phase_id}"
          x: 8
          y: 8
          scale: 1
          fg_luma: 1.0
          bg_luma: 0.0

  # Scratch dropouts plus a square tone at higher amplitude.
  - name: ScratchDropouts
    type: progressive
    source: "{bundled}/exr/720x486/LUMA_RAMP.exr"
    duration_frames: 8
    dropouts:
      scratch:
        scale: 4
    line_injections:
      - type: vits
        vits_type: virs
        target_lines: [21]
    audio:
      channel_pairs:
        - pair: 0
          left:  { waveform: square, frequency: 440.0, amplitude: 0.7 }
          right: { waveform: square, frequency: 440.0, amplitude: 0.7 }

  # Silence gap: no audio: block, but the WAV stays frame-locked.
  - name: SilenceGap
    type: progressive
    source: "{bundled}/exr/720x486/PLUGE.exr"
    duration_frames: 8

  # MKV source section.
  - name: MotionZone
    type: progressive
    source: "{bundled}/mkv/720x486/MOVING_ZONE_2H.mkv"
    duration_frames: 8
    line_injections:
      - type: vits
        vits_type: virs
        target_lines: [21]
