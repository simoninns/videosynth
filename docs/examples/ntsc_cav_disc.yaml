# NTSC CAV LaserDisc — comprehensive demonstration
#
# A complete, runnable NTSC CAV disc master. NTSC laserdisc requires both the
# 24-bit biphase codes AND the 40-bit FM codes in every section, plus a VIRS
# colour reference on lines 19/282 (IEC 60857 §9.1.3). On top of the disc codes
# this demo layers OSD, noise, dropouts and audio:
#   - 24-bit biphase: picture_number, chapter_number, programme_status,
#     users_code
#   - 40-bit FM: fm_picture_number (lines 10/273), fm_white_flag (lines 11/274)
#   - virs VITS on every section (mandatory on NTSC laserdisc)
#   - OSD label + per-frame tokens, source noise, random/scratch dropouts,
#     frame-locked audio
#   - LaserDisc digital audio (EFM) output for channel pair 0
#
# NTSC-specific rules enforced by the validator:
#   - Both biphase and FM codes must be present in every laserdisc section
#   - virs is mandatory; ntc7/fcc VITS types are rejected (they target the
#     biphase reserved VBI lines 10-18 / 273-281)
#   - ntsc_laserdisc_vbi_burst is not yet implemented and must stay disabled
#
# See docs/user/biphase-design.md for full documentation.

project:
  name: NtscCavShowcase
  version: "1.0"
  description: NTSC CAV LaserDisc showcase — biphase + FM codes, VIRS, OSD, noise, dropouts, audio

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_TBC_LOCKED

output:
  video_path: "{project}/output/ntsc_cav_showcase.composite"
  # LaserDisc digital audio: channel pair 0 is additionally encoded as an
  # IEC 60908-1999 EFM channel stream with mode-4 subcode
  # (IEC 60857:1986 Amd 2 clause 13), written as
  # <basename>_audio_0.efm beside the WAV track. One track is emitted per
  # programme_area section, in output order.
  efm_audio:
    pair: 0

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  - name: LeadIn
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_in
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_in
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x80D234"
  - name: Chapter0Bars
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: chapter_number
            chapter: 0
          - code_type: picture_stop
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "NTSC CAV Chapter0"
          x: 8
          y: 8
          scale: 2
          fg_luma: white
          bg_luma: black
        - text: "PN:{picture_number} PHASE:{phase_id}"
          x: 8
          y: 28
          scale: 1
          fg_luma: white
          bg_luma: black
    audio:
      channel_pairs:
        - pair: 0
          description: Analogue stereo
          left:  { waveform: sine, frequency: 1000.0, amplitude: 0.5 }
          right: { waveform: sine, frequency: 1000.0, amplitude: 0.5 }

  - name: Chapter1Motion
    type: progressive
    source: "{bundled}/mkv/720x486/MOVING_ZONE_2H.mkv"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: chapter_number
            chapter: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
    dropouts:
      random:
        scale: 8

  - name: Chapter2Ramps
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: chapter_number
            chapter: 2
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    dropouts:
      scratch:
        scale: 4

  - name: LeadOut
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 8
    section_type: lead_out
    line_injections:
      - type: laserdisc
        codes:
          - code_type: lead_out
          - code_type: fm_white_flag
          - code_type: users_code
            users_code: "0x87D000"